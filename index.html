<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newfound Global — Email Signature Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Work Sans', Arial, sans-serif; background: #1a1b2e; color: #fff; min-height: 100vh; }

  .layout { display: flex; min-height: 100vh; }

  /* --- Left: Form Panel --- */
  .form-panel {
    width: 420px; min-width: 420px; background: #23243a; padding: 40px 32px;
    overflow-y: auto; border-right: 1px solid #33344a;
  }
  .form-panel h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .form-panel .subtitle { font-size: 13px; color: #8a8a9f; margin-bottom: 32px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: #b0b0be; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #3a3b52;
    background: #1a1b2e; color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: border-color .2s;
  }
  .field input:focus, .field select:focus { border-color: #f36967; }
  .field input::placeholder { color: #555; }

  .divider { height: 1px; background: #33344a; margin: 28px 0; }

  /* --- Right: Preview + Actions --- */
  .preview-panel { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; }
  .preview-panel h2 { font-size: 16px; font-weight: 600; color: #b0b0be; margin-bottom: 20px; }

  .preview-frame {
    background: #fff; border-radius: 12px; padding: 24px; max-width: 540px; width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 12px 28px; border-radius: 8px; border: none; font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn-primary { background: #f36967; color: #fff; }
  .btn-primary:hover { background: #e0504e; }
  .btn-secondary { background: transparent; color: #f36967; border: 2px solid #f36967; }
  .btn-secondary:hover { background: rgba(243,105,103,0.1); }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #2ecc71; color: #fff; padding: 12px 28px; border-radius: 8px;
    font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .form-panel { width: 100%; min-width: unset; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- FORM -->
  <div class="form-panel">
    <h1>Signature Generator</h1>
    <p class="subtitle">Fill in the details, preview on the right, then copy.</p>

    <div class="field">
      <label>First Name</label>
      <input type="text" id="firstName" placeholder="Amy" value="Amy" oninput="render()">
    </div>
    <div class="field">
      <label>Last Name</label>
      <input type="text" id="lastName" placeholder="Gallagher" value="Gallagher" oninput="render()">
    </div>
    <div class="field">
      <label>Job Title</label>
      <input type="text" id="jobTitle" placeholder="Head of Marketing | Newfound Global" value="Head of Marketing | Newfound Global" oninput="render()">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="amy.gallagher@newfound.global" value="amy.gallagher@newfound.global" oninput="render()">
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="+44 (0)7984 817 953" value="+44 (0)7984 817 953" oninput="render()">
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>LinkedIn URL</label>
      <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/..." value="https://www.linkedin.com/in/amy-gallagher-superflat-marketing/" oninput="render()">
    </div>
    <div class="field">
      <label>LinkedIn Display Name</label>
      <input type="text" id="linkedinName" placeholder="Amy Gallagher" value="Amy Gallagher" oninput="render()">
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>CTA Button Text</label>
      <input type="text" id="ctaText" placeholder="Download our latest report" value="Download our latest report" oninput="render()">
    </div>
    <div class="field">
      <label>CTA Button Link</label>
      <input type="url" id="ctaLink" placeholder="https://www.newfound.global/breakingnewground" value="https://www.newfound.global/breakingnewground" oninput="render()">
    </div>
    <div class="field">
      <label>Website</label>
      <input type="text" id="website" placeholder="newfound.global" value="newfound.global" oninput="render()">
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-panel">
    <h2>LIVE PREVIEW</h2>
    <div class="preview-frame">
      <div id="signaturePreview"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="copyHTML()">Copy Signature HTML</button>
      <button class="btn btn-secondary" onclick="downloadHTML()">Download as HTML File</button>
      <button class="btn btn-secondary" onclick="resetForm()">Reset to Defaults</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
function getValues() {
  return {
    firstName:    document.getElementById('firstName').value || 'First',
    lastName:     document.getElementById('lastName').value || 'Last',
    jobTitle:     document.getElementById('jobTitle').value || 'Title',
    email:        document.getElementById('email').value || 'email@newfound.global',
    phone:        document.getElementById('phone').value || '+44 0000 000 000',
    linkedinUrl:  document.getElementById('linkedinUrl').value || '#',
    linkedinName: document.getElementById('linkedinName').value || 'Name',
    ctaText:      document.getElementById('ctaText').value || 'Download our latest report',
    ctaLink:      document.getElementById('ctaLink').value || '#',
    website:      document.getElementById('website').value || 'newfound.global',
  };
}

function phoneToTel(phone) {
  return phone.replace(/[\s\(\)\-]/g, '');
}

function buildSignature(v) {
  return `<table cellpadding="0" cellspacing="0" border="0" width="480" style="width:480px; max-width:480px; border-collapse:collapse; background-color:#2C2D3D;">
<tr>
<td style="padding:0; margin:0; position:relative;">
<table cellpadding="0" cellspacing="0" border="0" width="480" style="width:480px; background-image:url('https://design-shifu.github.io/newfound/signature-bg.png'); background-size:cover; background-position:center top; background-repeat:no-repeat; background-color:#2C2D3D; border-collapse:collapse;">
<tr>
<td style="padding:20px 26px 22px 26px; font-family:'Work Sans', Arial, Helvetica, sans-serif;">

  <table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding-bottom:16px;">
      <a href="https://${v.website}" target="_blank" style="text-decoration:none;">
        <img src="https://design-shifu.github.io/newfound/newfound-logo.png" alt="Newfound" width="90" height="auto" style="display:block; border:0; max-width:90px;" />
      </a>
    </td>
  </tr>
  </table>

  <table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:20px; font-weight:800; line-height:1.2; letter-spacing:-0.2px; padding-bottom:8px;">
      <span style="color:#E8655A;">${v.firstName}</span><span style="color:#FFFFFF;">&nbsp;${v.lastName}</span>
    </td>
  </tr>
  </table>

  <table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:12px; font-weight:400; color:#B0B0BE; line-height:1.5; padding-bottom:3px;">
      ${v.jobTitle}
    </td>
  </tr>
  </table>

  <table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:11px; font-weight:400; line-height:1.5; padding-bottom:16px;">
      <a href="mailto:${v.email}" style="color:#8A8A9F; text-decoration:none;">${v.email}</a>
    </td>
  </tr>
  </table>

  <table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td width="24" valign="middle" style="padding-right:8px; vertical-align:middle;">
      <a href="${v.linkedinUrl}" target="_blank" style="text-decoration:none;">
        <img src="https://design-shifu.github.io/newfound/linkedin-icon.png" alt="LinkedIn" width="22" height="22" style="display:block; border:0; border-radius:3px;" />
      </a>
    </td>
    <td valign="middle" style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:11px; font-weight:400; color:#FFFFFF; vertical-align:middle;">
      <a href="${v.linkedinUrl}" target="_blank" style="color:#FFFFFF; text-decoration:none;">${v.linkedinName}</a>
    </td>
  </tr>
  </table>

  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse;">
  <tr>
    <td style="padding-top:12px; padding-bottom:12px;">
      <div style="height:1.5px; background-color:#E8655A; line-height:0; font-size:0;">&nbsp;</div>
    </td>
  </tr>
  </table>

  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse;">
  <tr>
    <td valign="middle" style="vertical-align:middle;">
      <table cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:13px; font-weight:700; color:#FFFFFF; line-height:1.4; padding-bottom:2px;">
          <a href="tel:${phoneToTel(v.phone)}" style="color:#FFFFFF; text-decoration:none;">${v.phone}</a>
        </td>
      </tr>
      <tr>
        <td style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:11px; font-weight:400; color:#B0B0BE; line-height:1.4;">
          <a href="https://${v.website}" target="_blank" style="color:#B0B0BE; text-decoration:none;">${v.website}</a>
        </td>
      </tr>
      </table>
    </td>
    <td valign="middle" align="right" style="vertical-align:middle; text-align:right;">
      <table cellpadding="0" cellspacing="0" border="0" align="right" style="border-collapse:separate;">
      <tr>
        <td align="center" valign="middle" style="border:1.5px solid #E8655A; border-radius:5px; padding:7px 14px; background-color:rgba(232,101,90,0.12);">
          <a href="${v.ctaLink}" target="_blank" style="font-family:'Work Sans', Arial, Helvetica, sans-serif; font-size:10px; font-weight:500; color:#FFFFFF; text-decoration:none; display:inline-block; white-space:nowrap;">
            <img src="https://design-shifu.github.io/newfound/download-icon.png" alt="" width="13" height="13" style="display:inline-block; vertical-align:middle; margin-right:6px; border:0;" /><span style="vertical-align:middle;">${v.ctaText}</span>
          </a>
        </td>
      </tr>
      </table>
    </td>
  </tr>
  </table>

</td>
</tr>
</table>
</td>
</tr>
</table>`;
}

function render() {
  const v = getValues();
  document.getElementById('signaturePreview').innerHTML = buildSignature(v);
}

function copyHTML() {
  const v = getValues();
  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature - ${v.firstName} ${v.lastName} | Newfound Global</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap');
</style>
</head>
<body style="margin:0; padding:0; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
${buildSignature(v)}
</body>
</html>`;

  navigator.clipboard.writeText(html).then(() => showToast('Copied to clipboard!'));
}

function downloadHTML() {
  const v = getValues();
  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature - ${v.firstName} ${v.lastName} | Newfound Global</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap');
</style>
</head>
<body style="margin:0; padding:0; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
${buildSignature(v)}
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `signature-${v.firstName.toLowerCase()}-${v.lastName.toLowerCase()}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function resetForm() {
  document.getElementById('firstName').value = 'Amy';
  document.getElementById('lastName').value = 'Gallagher';
  document.getElementById('jobTitle').value = 'Head of Marketing | Newfound Global';
  document.getElementById('email').value = 'amy.gallagher@newfound.global';
  document.getElementById('phone').value = '+44 (0)7984 817 953';
  document.getElementById('linkedinUrl').value = 'https://www.linkedin.com/in/amy-gallagher-superflat-marketing/';
  document.getElementById('linkedinName').value = 'Amy Gallagher';
  document.getElementById('ctaText').value = 'Download our latest report';
  document.getElementById('ctaLink').value = 'https://www.newfound.global/breakingnewground';
  document.getElementById('website').value = 'newfound.global';
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

render();
</script>
</body>
</html>
